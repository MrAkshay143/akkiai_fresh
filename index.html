<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akki Ai — Your Personal AI Companion</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script>
      try { localStorage.setItem('akki_onboarding_seen', 'true'); } catch(e){}
      try {
        // Purge any obsolete legacy storage keys
        for (var i = localStorage.length - 1; i >= 0; i--) {
          var k = localStorage.key(i);
          if (k && !/^(akki|gemini)/i.test(k)) {
            localStorage.removeItem(k);
          }
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@200;300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="./assets/nexus-avatar-engine.js"></script>
  </head>
  <body class="bg-[var(--bg-primary)] text-j-text-primary overflow-hidden select-none font-sans">
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
